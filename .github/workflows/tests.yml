name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the README advertises; 3.13 is the newest
        # release the collectors/reporting layer is expected to run on.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # WeasyPrint (PDF rendering) needs Pango/Cairo plus HarfBuzz's
      # subsetting library; without libharfbuzz-subset0 it degrades font
      # subsetting at PDF-write time, and CI genuinely renders PDFs.
      - name: Install system dependencies for PDF rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz-subset0 \
            libffi-dev shared-mime-info fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile all Python sources
        run: python -m compileall -q shared skills

      - name: Run test suite
        run: python -m pytest tests/ -v --maxfail=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Rule selection lives in pyproject.toml, NOT inline here, so a local
      # `ruff check` produces exactly what CI produces. (When this passed
      # `--select F` inline, a bare local run reported 91 findings CI
      # ignored -- which just teaches people to ignore the linter.)
      - name: Lint
        run: ruff check shared/ skills/ tests/

  script-help:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every skill CLI script must expose --help without touching AWS
        run: |
          set -euo pipefail
          for script in skills/*/scripts/*.py; do
            echo "=== $script ==="
            python "$script" --help
          done
